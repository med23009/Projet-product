<div class="container">
  <div class="row mb-3">
    <div class="col-md-8">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search by name"
          [(ngModel)]="nom"
        />
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            (click)="searchName()"
          >
            Search
          </button>
        </div>
      </div>
    </div>
  </div>

  <h4 class="mb-3">Products List</h4>
  
  <!-- Loading and Error States -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Products Grid -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let product of products; let i = index">
      <div class="card h-100" 
           [class.border-primary]="i == currentIndex"
           (click)="setActiveProduct(product, i)">
        <div class="card-body">
          <h5 class="card-title">{{ product.nom }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge bg-primary rounded-pill fs-6">{{ product.prix }} MRU</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- No Products Message -->
  <div *ngIf="!loading && !error && products.length === 0" class="alert alert-info">
    No products found.
  </div>

  <button class="btn btn-danger mt-3" (click)="removeAllProducts()">
    Remove All
  </button>

  <!-- Product Details -->
  <div *ngIf="currentProduct.id" class="mt-4">
    <h4>Selected Product Details</h4>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{ currentProduct.nom }}</h5>
        <p class="card-text">{{ currentProduct.description }}</p>
        <div class="mb-2">
          <strong>Price:</strong> {{ currentProduct.prix }} MRU
        </div>
        <a class="btn btn-primary btn-sm" [routerLink]="['/products', currentProduct.id]">
          Edit
        </a>
      </div>
    </div>
  </div>
</div>
